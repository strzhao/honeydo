name: publish

on:
  push:
    tags: ["honeydo-v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # tag 版本 == 根 package.json version（去 honeydo-v 前缀比对）
      - name: verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#honeydo-v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag honeydo-v$TAG != package.json v$PKG"; exit 1
          fi

      # 清掉 setup-node 写入的占位 token，避免 npm 11 在 workspace 子目录 ENOWORKSPACES
      - name: publish with provenance
        run: |
          sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" || true
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ""
