name: publish

on:
  push:
    tags: ["honeydo-v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # node 22 自带 npm 10.x，OIDC trusted publishing 需 npm >= 11.5.1（否则 ENEEDAUTH）
      - run: npm install -g npm@^11
      - run: npm ci
      - name: install ffmpeg（lmedia 测试硬依赖）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # lmedia sfx 的 DSP 用例（trim/normalize/accept）走 .venv-audio + python/sfx.py，
      # 只需 numpy+soundfile；torch/权重类用例自带缺失守卫，无需真装
      - name: setup lmedia DSP venv（numpy+soundfile）
        run: |
          sudo mkdir -p /opt/lmedia-rt && sudo chown "$USER" /opt/lmedia-rt
          python3 -m venv /opt/lmedia-rt/.venv-audio
          /opt/lmedia-rt/.venv-audio/bin/pip install -q numpy soundfile
          echo "LMEDIA_RUNTIME=/opt/lmedia-rt" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test

      # tag 版本 == 根 package.json version（去 honeydo-v 前缀比对）
      - name: verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#honeydo-v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag honeydo-v$TAG != package.json v$PKG"; exit 1
          fi

      # 清掉 setup-node 写入的占位 token，避免 npm 11 在 workspace 子目录 ENOWORKSPACES
      - name: publish with provenance
        run: |
          sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" || true
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ""
