name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install ffmpeg（lmedia 测试硬依赖）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx biome check .
